# Codemagic CI for the CyberNet AI iPhone app (BUILD-PLAN §10).
#
# A build starts only when the owner presses "Start new build" in Codemagic, or when a release tag
# is pushed on purpose (ios-sim-* or ios-testflight-*). Ordinary pushes never start one (the free
# plan has 500 macOS minutes a month). Netlify never reads this file.
#
# This repository is PUBLIC. Nothing secret is written here. Signing uses what the owner set up in
# Codemagic > Settings (personal account), referenced by name only (set up 29 Oct 2026):
#   Developer Portal integration  "CyberNet ASC"   the App Store Connect API key (App Manager)
#   iOS certificate               cybernet_dist    Apple Distribution, generated in Codemagic
#   iOS provisioning profiles     cybernet_app_store (app.cybernetai)
#                                 cybernet_share_app_store (app.cybernetai.share)
# The app's Apple ID (6828596086) and Team ID (5VT6U6GMC2) are not secret.
#
# Workflows: ios-simulator (no Apple account needed) and ios-testflight (signed build uploaded to
# TestFlight; the owner presses Submit for review in App Store Connect).

workflows:
  ios-simulator:
    name: iOS simulator build, smoke run and screenshots
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-sim-*'
    environment:
      xcode: "26.6"        # pinned (iOS 26 SDK): "Xcode 26 or later", and iPhone Duo runs the app in
                           # compatibility mode. Never latest/edge (BUILD-PLAN §1, §3).
      node: 22
    scripts:
      - name: Site build tools (esbuild + acorn at the root lockfile versions, without the 1,188-package netlify-cli tree)
        script: |
          set -euo pipefail
          mkdir -p /tmp/rootdeps && cd /tmp/rootdeps && npm init -y >/dev/null
          npm install --no-audit --no-fund esbuild@0.28.1 acorn@8.18.0
          mkdir -p "$CM_BUILD_DIR/node_modules" && cp -R /tmp/rootdeps/node_modules/. "$CM_BUILD_DIR/node_modules/"
      - name: Install
        working_directory: mobile
        script: npm ci
      - name: Build iOS web bundle (debug flavour) + gate
        working_directory: mobile
        script: npm run build:web -- --debug && npm run check:bundle -- --debug
        # --debug adds web-ios/debug.js (demo screens, engine self-test, on-screen error panel). The
        # release bundle never contains it; ios-testflight rejects it. The native side passes
        # CN_DEMO_SCREEN / CN_ENGINE_SELFTEST to the page only in Debug builds (#if DEBUG).
      - name: Bundle behaviour and engine-fixture checks (Node)
        working_directory: mobile
        script: node tests/run-bundle.mjs && node tests/make-engine-fixtures.mjs --check
        # Release-bundle structure, the compiled sign-up/team-log/verdict behaviour, and the Share
        # Extension's engine.html labels against every engine case (the WebKit parity run below covers
        # the app's own WebKit only).
      - name: Capacitor sync + native project check
        working_directory: mobile
        script: |
          set -euo pipefail
          npx cap sync ios
          node scripts/add-share-extension.cjs --check
      - name: Lint plists and privacy manifests
        script: |
          set -euo pipefail
          for f in mobile/ios/App/App/Info.plist mobile/ios/App/App/App.entitlements \
                   mobile/ios/App/App/PrivacyInfo.xcprivacy mobile/ios/App/ShareExtension/Info.plist \
                   mobile/ios/App/ShareExtension/ShareExtension.entitlements \
                   mobile/ios/App/ShareExtension/PrivacyInfo.xcprivacy; do
            plutil -lint "$f"
          done
          xcodebuild -list -project mobile/ios/App/App.xcodeproj
      - name: Build for simulator
        script: |
          set -euo pipefail
          mkdir -p build
          if ! xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
                 -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
                 -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > build/xcodebuild-sim.log 2>&1; then
            grep -nE "error:|fatal" build/xcodebuild-sim.log | head -80 || true
            tail -120 build/xcodebuild-sim.log
            exit 1
          fi
          echo "Swift warnings in our code:"
          grep -E "/mobile/ios/App/(App|Shared|ShareExtension)/.*warning:" build/xcodebuild-sim.log | sort -u | head -60 || true
      - name: Check the built app and its Share Extension
        script: |
          set -euo pipefail
          fail() { echo "FAILED: $1"; exit 1; }
          APP=build/sim/Build/Products/Debug-iphonesimulator/App.app
          APPEX="$APP/PlugIns/ShareExtension.appex"
          [ -d "$APPEX" ] || fail "ShareExtension.appex is not embedded"
          for f in "$APP/PrivacyInfo.xcprivacy" "$APPEX/PrivacyInfo.xcprivacy" "$APPEX/engine.html" "$APPEX/engine/cybernet-engine.js"; do
            [ -f "$f" ] || fail "missing $f"
          done
          cmp -s "$APPEX/engine/cybernet-engine.js" public/cybernet-engine.js || fail "extension engine differs from public/cybernet-engine.js"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | grep -E "UsageDescription|ITSAppUses" || true
          KEYS=$(/usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | grep -oE "NS[A-Za-z]+UsageDescription" | sort -u | tr '\n' ' ')
          [ "$KEYS" = "NSCameraUsageDescription NSUserTrackingUsageDescription " ] || fail "unexpected permission prompts: $KEYS"
          if /usr/libexec/PlistBuddy -c Print "$APPEX/Info.plist" | grep -q "UsageDescription"; then fail "the extension asks for a permission"; fi
          for k in CFBundleShortVersionString CFBundleVersion; do
            a=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist")
            e=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APPEX/Info.plist")
            [ "$a" = "$e" ] || fail "$k differs: app $a, extension $e (ITMS-90473)"
          done
          [ "$(plutil -extract NSPrivacyTracking raw "$APP/PrivacyInfo.xcprivacy")" = "true" ] || fail "app manifest must declare tracking (Google Analytics)"
          [ "$(plutil -extract NSPrivacyTracking raw "$APPEX/PrivacyInfo.xcprivacy")" = "false" ] || fail "extension manifest must not track"
          echo "Plugin privacy manifests in the app:"
          find "$APP" -name PrivacyInfo.xcprivacy | sed "s|$APP/||"
      - name: Engine parity in the simulator's WebKit
        script: bash mobile/scripts/engine-parity.sh   # every engine test case, Node vs the app's WebKit
      - name: Smoke run + screenshots
        script: bash mobile/scripts/screenshots.sh
      - name: Cloudflare check (information only, never fails the build)
        ignore_failure: true
        script: |
          # The app calls https://cybernetai.app/api/* from capacitor://localhost. Cloudflare has
          # challenged data-centre traffic before (recovery-mode.mts). These are the requests the app
          # sends first, without any sign-in. Before the web deploy the CORS header is expected to be
          # missing; afterwards each must answer 2xx/204 with access-control-allow-origin and no
          # cf-mitigated header (PRE-SUBMISSION-CHECKLIST F18).
          for spec in "OPTIONS /api/account-status GET" "OPTIONS /api/ai-consent POST" "GET /api/account-status -"; do
            set -- $spec
            echo "== $1 $2"
            if [ "$1" = "OPTIONS" ]; then
              curl -s -o /dev/null -D - -m 15 -X OPTIONS "https://cybernetai.app$2" -H "Origin: capacitor://localhost" \
                -H "Access-Control-Request-Method: $3" -H "Access-Control-Request-Headers: authorization,content-type,x-cybernet-platform,x-cybernet-app-version" \
                | grep -iE "^HTTP/|^access-control-allow-origin|^cf-mitigated|^server:" || echo "(no answer)"
            else
              curl -s -o /dev/null -D - -m 15 "https://cybernetai.app$2" -H "Origin: capacitor://localhost" -H "X-CyberNet-Platform: ios" \
                | grep -iE "^HTTP/|^access-control-allow-origin|^cf-mitigated|^server:" || echo "(no answer)"
            fi
          done
          true
      - name: Keep the simulator app for the iPhone Duo check
        script: |
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qr "$CM_BUILD_DIR/build/App-sim.zip" App.app
      - name: Keep the resolved Swift package versions (commit it to pin them)
        script: |
          f=mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$f" ]; then cp "$f" build/Package.resolved; cat build/Package.resolved; else echo "No Package.resolved written."; fi
    artifacts:
      - build/Package.resolved
      - build/screenshots/**/*.png
      - build/screenshots/**/*.jpg
      - build/screenshots/**/*.log
      - build/screenshots/crash/*
      - build/videos/*.mp4
      - build/App-sim.zip
      - build/parity/*
      - build/*.log
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight (signed release build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-testflight-*'
    integrations:
      app_store_connect: CyberNet ASC   # Codemagic Developer Portal integration (key name, not the key)
    environment:
      xcode: "26.6"        # same pin as ios-simulator
      node: 22
      ios_signing:
        provisioning_profiles:
          - cybernet_app_store         # app.cybernetai, App Store
          - cybernet_share_app_store   # app.cybernetai.share, App Store
        certificates:
          - cybernet_dist              # Apple Distribution
      vars:
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: app.cybernetai
        SHARE_BUNDLE_ID: app.cybernetai.share
        APP_STORE_APPLE_ID: 6828596086   # App Store Connect > App Information (not secret)
    scripts:
      - name: Site build tools (esbuild + acorn at the root lockfile versions, without the 1,188-package netlify-cli tree)
        script: |
          set -euo pipefail
          mkdir -p /tmp/rootdeps && cd /tmp/rootdeps && npm init -y >/dev/null
          npm install --no-audit --no-fund esbuild@0.28.1 acorn@8.18.0
          mkdir -p "$CM_BUILD_DIR/node_modules" && cp -R /tmp/rootdeps/node_modules/. "$CM_BUILD_DIR/node_modules/"
      - name: Install, release bundle, gate, sync, native check
        working_directory: mobile
        script: |
          set -euo pipefail
          npm ci
          npm run build:web
          npm run check:bundle
          npx cap sync ios
          node scripts/add-share-extension.cjs --check
      - name: Signing for the app and the Share Extension (profiles from ios_signing above)
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build number (latest TestFlight build + 1, app and extension together)
        script: |
          set -euo pipefail
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          cd mobile/ios/App && agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      - name: Verify the shipped bundle
        script: |
          set -euo pipefail
          fail() { echo "FAILED: $1"; exit 1; }
          rm -rf build/ipa && mkdir -p build/ipa
          unzip -q -o build/ios/ipa/*.ipa -d build/ipa
          APP=build/ipa/Payload/App.app
          APPEX="$APP/PlugIns/ShareExtension.appex"
          [ -d "$APPEX" ] || fail "ShareExtension.appex is not embedded"
          if grep -q '"server"' "$APP/capacitor.config.json"; then fail "capacitor.config.json has a server block (remote code)"; fi
          if grep -qE '"webContentsDebuggingEnabled": *true' "$APP/capacitor.config.json"; then fail "Web Inspector is on in a release build"; fi
          [ -f "$APP/PrivacyInfo.xcprivacy" ] || fail "app privacy manifest missing"
          [ -f "$APPEX/PrivacyInfo.xcprivacy" ] || fail "extension privacy manifest missing"
          if grep -rqiE 'CN_DEMO_SCREEN|CN_ENGINE_SELFTEST|cn-debug-errors' "$APP/public"; then fail "debug-only web code in the release bundle"; fi
          if strings "$APP/App" | grep -qE 'CN_DEMO_SCREEN|CN_ENGINE_SELFTEST'; then fail "debug-only native hook in the release binary"; fi
          cmp -s "$APPEX/engine/cybernet-engine.js" public/cybernet-engine.js || fail "extension engine differs from public/cybernet-engine.js"
          KEYS=$(/usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | grep -oE "NS[A-Za-z]+UsageDescription" | sort -u | tr '\n' ' ')
          [ "$KEYS" = "NSCameraUsageDescription NSUserTrackingUsageDescription " ] || fail "unexpected permission prompts: $KEYS"
          for k in CFBundleShortVersionString CFBundleVersion; do
            a=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist")
            e=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APPEX/Info.plist")
            [ "$a" = "$e" ] || fail "$k differs: app $a, extension $e (ITMS-90473)"
          done
          APP_ENT=$(codesign -d --entitlements - "$APP" 2>&1 || true)
          EXT_ENT=$(codesign -d --entitlements - "$APPEX" 2>&1 || true)
          echo "$APP_ENT" | grep -q "group.app.cybernetai" || fail "app is not signed with the App Group"
          echo "$APP_ENT" | grep -q "com.apple.developer.applesignin" || fail "app is not signed with Sign in with Apple"
          echo "$EXT_ENT" | grep -q "group.app.cybernetai" || fail "extension is not signed with the App Group"
          if echo "$APP_ENT$EXT_ENT" | grep -qE "aps-environment|associated-domains"; then fail "push or associated domains are not part of 1.0"; fi
          mkdir -p build
          xcodebuild -version | tee build/xcode-version.txt   # evidence for PRE-SUBMISSION-CHECKLIST D1
    artifacts:
      - build/ios/ipa/*.ipa
      - build/xcode-version.txt
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration             # the "CyberNet ASC" integration above
        submit_to_testflight: false   # internal testers get every processed build without beta review;
                                      # set to true only for the optional external beta review
                                      # (OWNER-WINDOWS-GUIDE Part 14) once its test information is filled in
        submit_to_app_store: false    # the owner presses Submit in App Store Connect
