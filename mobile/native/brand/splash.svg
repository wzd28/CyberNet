<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!-- Launch screen image: the plain brand ground, nothing else (owner, 10 Nov 2026: the app's loading screen is the
       website's). The website's first frame has no mark: the shield draws itself from the bottom point after 0.2 s and
       the padlock arrives at 1.0 s, so a mark here would make the draw-on look like a restart. The web stage (ios.css .cn-ix)
       starts on the same #060a14 and fades the glow and dot grid in, so the hand-over has no jump. Shown with
       scaleAspectFill. Render: run mobile/scripts/add-share-extension.cjs with the icons flag (see its header). -->
  <rect width="2732" height="2732" fill="#060a14"/>
</svg>
