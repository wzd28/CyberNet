[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera stays off: the web QR check reads an uploaded picture, it never opens the camera
    # (the iPhone app scans natively). The rest are features this site never uses (security audit
    # Nov 2026, WEB-5 / INFRA-6).
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()"
    # Cuts the window.opener link to and from pages of other sites (tab-nabbing, XS-Leaks). allow-popups
    # keeps any window this site opens itself working; sign-in with Google/Apple and Stripe are full-page
    # redirects, which COOP does not affect. No site-wide Cross-Origin-Resource-Policy on purpose: email
    # clients load the logo images from this site. HSTS is left to the owner (Cloudflare edge setting).
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Frame-Options = "DENY"
    # Built from what the site actually loads, measured in the browser rather
    # than assumed. jsDelivr is allowed for exactly two files, not the whole host
    # (any npm or GitHub file is served there): supabase-js (index.html,
    # app/reset.html) and three.js for the hero globe (ui-src/js/10-hero3d.js);
    # both also carry SRI. A version bump there must change this line too
    # (tests/run-security-web.mjs checks it). jsQR is self-hosted since Nov 2026
    # (/ui/vendor). Cloudflare Insights is the analytics beacon, and Supabase is
    # the only cross-origin fetch target. The fonts are self-hosted (public/ui/fonts,
    # since 19 Oct), so Google Fonts needs no entry.
    # Stripe needs no entry because checkout is a top-level redirect, which CSP
    # does not govern.
    # Google Analytics (GA4) gets exactly the hosts Google documents for it; the
    # script is only injected after a visitor accepts analytics cookies
    # (public/cybernet-consent.js).
    #
    # script-src and style-src keep 'unsafe-inline': index.html alone has five
    # inline <script> blocks (the ES-feature probe, the sign-in gate, the sign-up
    # source capture and two more; several carry data-web-only for the iOS build),
    # other pages have their own, there are inline style attributes, and Cloudflare
    # injects inline scripts at the edge (email obfuscation, the JS-detection
    # loader with a per-request ray id) that no hash can cover. That weakens the XSS
    # protection this header is mainly for, so it is a step rather than the
    # destination: moving the blocks into files and turning off those Cloudflare
    # features would let it drop (security audit Nov 2026, WEB-1).
    # Even so, this blocks script and style loads from any host not listed here,
    # which is the common injection route.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://ndtcxippbufqzwcxkyjd.supabase.co https://static.cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

# Pictures of the UI layer (the 3D renders and the photos). Every reference to them carries ?v=
# (index.html and ui-src/css; checked 18 Nov 2026), so a changed picture gets a new address and a
# repeat visit can use the cached file at once instead of asking the server about each one first.
# When a picture changes, bump its ?v= as always. Only .webp: scripts and styles keep revalidating.
[[headers]]
  for = "/ui/3d/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ui/img/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts (ui-src/css/00-fonts.css). Every file name carries its version, and a changed
# file gets a new name, so a repeat visit can use the cached file at once instead of revalidating
# it first (a revalidation round trip is what would let the first frame paint in the fallback).
[[headers]]
  for = "/ui/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
