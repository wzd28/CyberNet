[build]
  publish = "public"
  functions = "netlify/functions"
  # Skip the Netlify build when a commit only touches the iPhone app (mobile/,
  # codemagic.yaml) or docs: build credits are limited. Exit code 0 = no
  # changes in these paths = skip; anything here changed = build as usual.
  # When there is nothing to compare (a build without cache, "Clear cache and
  # deploy", or a redeploy of the same commit, for example to apply new
  # environment variables), Netlify sets CACHED_COMMIT_REF = COMMIT_REF: that
  # always builds (exit 1). A missing or unknown ref makes git fail, which
  # also builds.
  ignore = 'if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- public netlify netlify.toml package.json package-lock.json supabase'

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/quick-scan"
  to = "/index.html"
  status = 200

[[redirects]]
