[build]
  publish = "public"
  functions = "netlify/functions"
  # Skip the Netlify build when a commit only touches the iPhone app (mobile/,
  # codemagic.yaml) or docs: build credits are limited. Exit code 0 = no
  # changes in these paths = skip; anything here changed = build as usual.
  # When there is nothing to compare (a build without cache, "Clear cache and
  # deploy", or a redeploy of the same commit, for example to apply new
  # environment variables), Netlify sets CACHED_COMMIT_REF = COMMIT_REF: that
  # always builds (exit 1). A missing or unknown ref makes git fail, which
  # also builds.
  ignore = 'if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- public netlify netlify.toml package.json package-lock.json supabase'

[functions]
  node_bundler = "esbuild"

# The production site's own Netlify hosts show the pages at the real domain (security audit Nov
# 2026, INFRA-2): a second copy of the sign-in page on *.netlify.app splits sessions, skips
# Cloudflare and invites confusion. Query and #hash are kept by the redirect. Only these two hosts
# match; deploy previews and branch deploys (<name>--cybernet-ai.netlify.app) are untouched.
# /api/* is deliberately NOT redirected yet: a 301 on a POST from a server (the Stripe webhook, any
# external trigger) would break it, and where those point has not been confirmed. The first two
# rules keep the API answering on these hosts exactly as before; the owner removes them once every
# webhook is confirmed to use https://cybernetai.app (owner steps).
[[redirects]]
  from = "https://cybernet-ai.netlify.app/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "https://main--cybernet-ai.netlify.app/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "https://cybernet-ai.netlify.app/*"
  to = "https://cybernetai.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--cybernet-ai.netlify.app/*"
  to = "https://cybernetai.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
