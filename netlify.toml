# The App Store Support URL (iPhone app, BUILD-PLAN §7.10): a plain page with no
# site navigation or prices.
[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/support/"
  to = "/support.html"
  status = 200

# People type these by hand. Send them to the home page with the sign-in card open.
[[redirects]]
  from = "/login"
  to = "/?auth=login"
  status = 302

[[redirects]]
  from = "/signin"
  to = "/?auth=login"
  status = 302

[[redirects]]
  from = "/sign-in"
  to = "/?auth=login"
