[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    # Built from what the site actually loads, measured in the browser rather
    # than assumed: jsdelivr serves jsQR, Cloudflare Insights is the analytics
    # beacon, and Supabase is the only cross-origin fetch target. The fonts are
    # self-hosted (public/ui/fonts, since 19 Oct), so Google Fonts needs no entry.
    # Stripe needs no entry because checkout is a top-level redirect, which CSP
    # does not govern.
    # Google Analytics (GA4) gets exactly the hosts Google documents for it; the
    # script is only injected after a visitor accepts analytics cookies
    # (public/cybernet-consent.js).
    #
    # script-src and style-src keep 'unsafe-inline' because the page still has
    # two inline <script> blocks and inline style attributes. That weakens the
    # XSS protection this header is mainly for, so it is a step rather than the
    # destination - moving those inline blocks into files would let both drop.
    # Even so, this blocks script and style loads from any host not listed here,
    # which is the common injection route and is currently unrestricted.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://ndtcxippbufqzwcxkyjd.supabase.co https://static.cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

# Self-hosted fonts (ui-src/css/00-fonts.css). Every file name carries its version, and a changed
# file gets a new name, so a repeat visit can use the cached file at once instead of revalidating
# it first (a revalidation round trip is what would let the first frame paint in the fallback).
[[headers]]
  for = "/ui/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
